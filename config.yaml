# Kimikazee Qwopus Configuration
# =================================

# Model Provider Settings
provider: custom  # Options: 'custom', 'qwopus', 'openrouter', 'kimi'
model: Qwen3.5-9B-DeepSeek-V4-Flash-Q4_K_M.gguf

# Context & Inference
context_window: 128000
parallel: 4
n_predict: -1  # Generate until max context or stop token

# Sampling Strategy — Split by task type
# Default (chat/reasoning): balanced creativity
temp: 0.5
top_p: 0.92
top_k: 40
min_p: 0.05           # Prune tokens <5% of top token prob — cleaner than top_k alone
repeat_penalty: 1.1   # Prevent tool-call loops in long agent chains
mirostat: 2           # Target perplexity for coherent multi-step reasoning
mirostat_tau: 5.0     # Target entropy
mirostat_eta: 0.1     # Adaptation rate

# Per-task temperature overrides (used by server.py routing logic)
temp_tool_call: 0.15  # Deterministic tool calls
temp_reasoning: 0.5   # Some variation for exploring solutions
temp_chat: 0.8        # Personality + creativity

# Anti-hallucination
repeat_penalty_last_n: 256  # Look back further for repetition detection

# llama.cpp Optimizations (DO NOT CHANGE these!)
flash_attn: true  # Use -ngl when starting llama.cpp
n_threads: 8  # Auto-detect based on hardware
n_gpu_layers: -1  # Full GPU offload for RTX 4080 Super

# Discord Integration (when deployed as bot)
discord:
  require_mention: false  # NEVER change to true
  free_response_channels: "*"  # Respond to ALL channels

# Telegram Integration
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"  # Set via .env
  allow_groups: true

# Logging
log_level: INFO
log_file: ~/.hermes-beta/logs/agent.log

# Agent Swarm Settings (future feature)
max_parallel_agents: 4
agent_timeout: 300  # seconds

# Scratch Pad — Dual-Model Routing
# SmolLM2 1.7B (helper) handles routing, classification, and short completions.
# Qwopus 9B (main) handles reasoning, generation, and complex tasks.
scratchpad:
  enabled: true
  helper_endpoint: "http://localhost:8081"
  main_endpoint: "http://localhost:8080"
  helper_model: "SmolLM2-1.7B-Q4_K_M.gguf"
  main_model: "Kimikazee-Qwopus-DeepSeek-Q3_K_M.gguf"
  # Max tokens before routing to main model
  complexity_threshold: 3
  # Tasks always sent to helper (skip routing)
  helper_always: ["classify", "yes_no", "sentiment", "extract", "format"]
  # Tasks always sent to main (skip routing)
  main_always: ["code", "reasoning", "analysis", "creative", "multi_step"]
