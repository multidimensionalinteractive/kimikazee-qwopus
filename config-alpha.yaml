# Kimikazee Qwopus — Alpha Remote Config
# Points to Beta (100.71.243.108) model endpoints

provider: custom
model: Qwen3.5-9B-DeepSeek-V4-Flash-Q4_K_M.gguf

context_window: 128000
parallel: 4
n_predict: -1

temp: 0.5
top_p: 0.92
top_k: 40
min_p: 0.05
repeat_penalty: 1.1
mirostat: 2
mirostat_tau: 5.0
mirostat_eta: 0.1

temp_tool_call: 0.15
temp_reasoning: 0.5
temp_chat: 0.8

repeat_penalty_last_n: 256
flash_attn: true
n_threads: 8
n_gpu_layers: -1

discord:
  require_mention: false
  free_response_channels: "*"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  allow_groups: true

log_level: INFO
log_file: ~/.hermes-beta/logs/agent.log

max_parallel_agents: 4
agent_timeout: 300

# Scratch Pad — Remote endpoints to Beta
scratchpad:
  enabled: true
  helper_endpoint: "http://100.71.243.108:8081"
  main_endpoint: "http://100.71.243.108:8080"
  helper_model: "SmolLM2-1.7B-Q4_K_M.gguf"
  main_model: "Kimikazee-Qwopus-DeepSeek-Q3_K_M.gguf"
  complexity_threshold: 3
  helper_always: ["classify", "yes_no", "sentiment", "extract", "format"]
  main_always: ["code", "reasoning", "analysis", "creative", "multi_step"]
