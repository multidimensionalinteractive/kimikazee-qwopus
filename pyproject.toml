[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kimikazee-qwopus"
version = "1.0.0"
description = "Qwen3.5-9B-Uncensored hyper agent system"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kimikazee Team", email = "team@kimikazee.com"}
]
maintainers = [
    {name = "Kimikazee Team", email = "team@kimikazee.com"}
]
keywords = [
    "ai",
    "llm",
    "qwen",
    "agent",
    "fastapi",
    "transformers",
    "llama.cpp",
    "gguf"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.25.0",
    "llama-cpp-python>=0.2.17",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httptools>=0.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "concurrent-log-handler>=0.9.0",
    "python-json-logger>=2.0.0",
    "python-multipart>=0.0.6",
    "aiocache>=0.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-watch>=4.2.0",
    "flake8>=6.1.0",
    "black>=23.12.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "pyright>=1.1.350",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
    "pre-commit>=3.5.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

docs = [
    "sphinx>=7.2.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/kimikazee/kimikazee-qwopus"
"Bug Reports" = "https://github.com/kimikazee/kimikazee-qwopus/issues"
"Documentation" = "https://kimikazee.github.io/kimikazee-qwopus"
"Source" = "https://github.com/kimikazee/kimikazee-qwopus"
"Discussions" = "https://github.com/kimikazee/kimikazee-qwopus/discussions"

[project.scripts]
qwopus = "kimikazee_qwopus:main"
kimikazee-qwopus = "kimikazee_qwopus:main"

[tool.setuptools.packages.find]
include = ["kimikazee_qwopus*"]

[tool.setuptools.package-data]
"kimikazee_qwopus" = ["config.yaml"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".git", "venv", ".venv", "__pycache__"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "-v",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async test case",
    "integration: mark test as integration test",
    "unit: mark test as unit test",
    "slow: mark test as slow to run",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["server", "kimikazee_qwopus"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 80
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "tests/",
    ".git/",
    ".pytest_cache/",
    "venv/",
    ".venv/",
]

[tool.ruff]
line-length = 120
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "W503", # line break before binary operator
]
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
]

[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-few-public-methods
    "W0511", # fixme
]

[tool.pylint.format]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T001", "T002"]
"__init__.py" = ["F401"]
