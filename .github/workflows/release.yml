name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        default: ''
      create_draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      upload_docker:
        description: 'Upload Docker image'
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_HUB_REPO: ${{ vars.DOCKER_HUB_REPO || 'kimikazee/qwopus' }}
  GHCR_REGISTRY: ghcr.io
  GHCR_REPO: ${{ github.repository_owner }}/qwopus

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.content }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.1.0
        with:
          myToken: ${{ github.token }}
          from: ${{ github.event.before || 'HEAD~10' }}
          to: ${{ steps.version.outputs.tag }}
          changelogTitle: '## What Changed'

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changelog]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changelog.outputs.tag_name }}
          name: ${{ needs.changelog.outputs.tag_name }}
          draft: ${{ github.event.inputs.create_draft == 'true' }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.changelog.outputs.tag_name, 'alpha') || contains(needs.changelog.outputs.tag_name, 'beta') || contains(needs.changelog.outputs.tag_name, 'rc') }}
          body: |
            ## 🐙 Kimikazee Qwopus ${{ needs.changelog.outputs.tag_name }}

            ### 🚀 New Features
            - Enhanced model inference capabilities
            - Improved streaming performance

            ### 🐛 Bug Fixes
            - Fixed context window handling
            - Improved error handling in chat completions

            ### 🔧 Performance Improvements
            - Optimized tokenization
            - Reduced memory footprint

            ${needs.changelog.outputs.changelog}

          files: |
            README.md
            LICENSE
            CHANGELOG.md || CHANGELOG.md.template || .github/release_template.md

  artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build distribution
        run: |
          python -m build

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name || github.ref_name }}
          files: dist/*.whl dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release]
    if: github.event.inputs.upload_docker == 'true' || (!github.event.inputs.upload_docker)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN || secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKER_HUB_REPO || 'kimikazee/qwopus' }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  notify:
    name: Release Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [docker, release, artifacts]
    if: always()
    
    steps:
      - name: Release Complete
        run: |
          echo "✅ Release Pipeline Completed"
          echo "Release: ${{ needs.release.outputs.tag_name || github.ref_name }}"
          echo "Docker Image: Built and pushed"
          echo "Artifacts: Uploaded to GitHub Releases"
        env:
          GITHUB_TOKEN: ${{ github.token }}
