name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.yaml'
      - '**.yml'
      - '.gitignore'
      - '!.github/workflows/codeql.yml'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.yaml'
      - '**.yml'
      - '.gitignore'
      - '!.github/workflows/codeql.yml'
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config: |
            paths:
              - server.py
              - kimikazee_qwopus.py

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
          upload: true
          output: codeql-results

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pip-audit safety bandit dependabot-cli

      - name: Audit dependencies (pip-audit)
        run: |
          pip-audit -r requirements.txt --output format=sarif --output-file pip-audit-results.sarif || true

      - name: Check for vulnerabilities (safety)
        run: |
          safety check -r requirements.txt --output safety-results.txt || true
          # Continue even if vulnerabilities found

      - name: Run bandit security scanner
        run: |
          bandit -r . -ll --format=sarif -o bandit-results.sarif --exclude=__pycache__,.git,.pytest_cache,.venv,venv || true

      - name: Upload pip-audit results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit

      - name: Upload bandit results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Upload safety results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-results
          path: safety-results.txt

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitLeaks
        run: |
          curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | \
            grep "browser_download_url.*linux-amd64" | \
            cut -d : -f 3,4 | \
            tr -d \" | \
            xargs curl -L | tar -xz -C /tmp/ 2>/dev/null || true
          mv /tmp/gitleaks /usr/local/bin/ 2>/dev/null || true

      - name: Run GitLeaks
        run: |
          git ls-files | xargs gitleaks detect --source=. --report-formats=sarif --report-path=gitleaks-results.sarif 2>/dev/null || \
            echo "GitLeaks not installed, using alternative method"

      - name: Upload GitLeaks results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: Run TruffleHog (if available)
        run: |
          # Trufflehog is a good additional secret scanner
          # Uncomment if needed
          # trufflehog git file://. > trufflehog-results.txt || echo "TruffleHog not available"

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-results
          path: trufflehog-results.txt

  sast:
    name: SAST - SonarQube Analysis (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: false  # Disable by default - enable if you have SonarQube server
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SonarQube scanner
        run: |
          python -m pip install --upgrade pip
          pip install sonar-scanner
          
      - name: Analyze with SonarQube
        run: |
          sonar-scanner \
            -Dsonar.projectKey=${{ github.repository }} \
            -Dsonar.sources=. \
            -Dsonar.exclusions=tests/**,*.md \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  security-summary:
    name: Security Analysis Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [analyze, dependency-audit, secret-scan]
    if: always()
    
    steps:
      - name: Security Analysis Complete
        run: |
          echo "🔒 Security Analysis Completed"
          echo "CodeQL: ${{ needs.analyze.result }}"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
        env:
          CODEQL_RESULTS: ${{ github.event.pull_request.number && 'PR Analysis' || 'Push Analysis' }}
